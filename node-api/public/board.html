<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CampusFlow - Queue Board</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background:#0f172a; color:#e2e8f0; font-family:"Segoe UI",system-ui,sans-serif; }
    .card { background:#1e293b; border:0; border-radius:1rem; }
    .now { font-size:3.2rem; font-weight:800; color:#60a5fa; letter-spacing:.05em; }
    .muted { color:#94a3b8; }
  </style>
</head>
<body>
<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
    <h1 class="h3 mb-0">CampusFlow - Live Queue Board</h1>
    <div class="muted small"><span id="status">Loading...</span> - <a id="appLink" href="#" class="link-info">Open CampusFlow</a></div>
  </div>
  <div class="row g-4" id="grid"></div>
</div>
<script>
  const grid = document.getElementById("grid");
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  async function load() {
    try {
      const res = await fetch("/api/board");
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Error");
      document.getElementById("appLink").href = data.appUrl;
      document.getElementById("status").textContent = "Updated " + new Date(data.updated).toLocaleTimeString();
      grid.innerHTML = data.services.length ? data.services.map((s) => `
        <div class="col-md-6 col-xl-4"><div class="card h-100"><div class="card-body text-center">
          <div class="muted text-uppercase small">${esc(s.name)}</div>
          <div class="muted small mt-3">Now serving</div>
          <div class="now">${esc(s.nowServing || "--")}</div>
          <div class="mt-2"><span class="badge text-bg-secondary fs-6">${s.waiting} waiting</span></div>
        </div></div></div>`).join("") : '<div class="col-12 text-center muted">No services have been added yet.</div>';
    } catch (e) {
      document.getElementById("status").textContent = "Cannot reach backend: " + e.message;
    }
  }
  load(); setInterval(load, 5000);
</script>
</body>
</html>
